<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="sinhgadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sinhgadMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="accentFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sinhgad Emblem Crest -->
  <g transform="translate(10, 8)">
    <!-- Outer Crest Circle / Shield with Golden Accent -->
    <circle cx="32" cy="32" r="30" fill="url(#sinhgadMaroon)" stroke="url(#sinhgadGold)" stroke-width="2.5" />
    <circle cx="32" cy="32" r="25.5" fill="none" stroke="#fcd34d" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.6"/>

    <!-- Central Torch / Diya Flame (Symbol of Knowledge) -->
    <path d="M32 14 C35 21, 38 24, 38 28 C38 32, 35 34, 32 34 C29 34, 26 32, 26 28 C26 24, 29 21, 32 14 Z" fill="url(#accentFlame)" filter="url(#flameGlow)" />
    
    <!-- Torch Base / Diya Bowl -->
    <path d="M22 33 Q32 40 42 33 L40 37 Q32 43 24 37 Z" fill="url(#sinhgadGold)" />
    <rect x="29.5" y="38" width="5" height="11" rx="1.5" fill="url(#sinhgadGold)"/>
    <path d="M26 49 L38 49 L35 52 L29 52 Z" fill="#d97706" />

    <!-- Open Book / Laurel Wings -->
    <path d="M19 43 Q25 40 31 43 Q25 45 19 43 Z" fill="#ffffff" opacity="0.85" />
    <path d="M45 43 Q39 40 33 43 Q39 45 45 43 Z" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 20)">
    <!-- Main Institutional Name -->
    <text x="0" y="20" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="19" letter-spacing="1.5" fill="currentColor" class="sinhgad-title">SINHGAD INSTITUTES</text>
    
    <!-- Campus and College Details -->
    <text x="1" y="35" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10" letter-spacing="1" fill="#f59e0b" class="sinhgad-subtitle">SIT LONAVALA</text>
    <text x="86" y="35" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="9.5" letter-spacing="0.5" opacity="0.75" fill="currentColor">| Dept. of Computer Engg.</text>
  </g>
</svg>
