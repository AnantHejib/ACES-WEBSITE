<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="acesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0c2340" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="acesGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark: Tech Hexagon + Terminal Code Brackets + Diamond Ace -->
  <g transform="translate(10, 8)">
    <!-- Outer glass glow ring -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="url(#acesGrad)" fill-opacity="0.15" stroke="url(#acesGrad)" stroke-width="2"/>
    
    <!-- Inner geometric core -->
    <polygon points="32,12 50,23 50,42 32,52 14,42 14,23" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.7"/>

    <!-- Code bracket / Ace symbol < / > -->
    <path d="M24 26 L18 32 L24 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 26 L46 32 L40 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="3.5" fill="url(#glowGrad)" filter="url(#acesGlow)"/>
    <line x1="30" y1="23" x2="34" y2="41" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(78, 18)">
    <!-- Primary Title -->
    <text x="0" y="26" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="3" fill="currentColor" class="brand-title">ACES</text>
    
    <!-- Glowing dot accent -->
    <circle cx="95" cy="14" r="3" fill="#38bdf8" />

    <!-- Subtitle / Club expansion -->
    <text x="1" y="42" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="7.8" letter-spacing="0.7" fill="url(#acesGrad)" class="brand-subtitle">DEPARTMENT OF COMPUTER ENGINEERING POWERED BY ACES</text>
  </g>
</svg>
